name = "shopify-cloudflare-app"
roles = ["frontend", "backend"]
webhooks_path = "/webhooks/app/uninstalled"

[commands]
# What `shopify app dev` runs. React Router + @cloudflare/vite-plugin run the
# app in workerd, so dev matches production. (No Prisma: sessions are in KV —
# see app/session-storage.server.ts.)
dev = "react-router dev"
