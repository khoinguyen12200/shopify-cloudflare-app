# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c0a58386cf12f142409e63d22589b9d9"
name = "My App (Dev)"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Keeps subscription_events current — see app/routes/webhooks/app/subscriptions-update.tsx
  # and the internal console's Subscriptions page, which reads it.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  # MANDATORY for every app distributed through the Shopify App Store — all
  # three topics, whether or not the app stores personal data. Missing or
  # non-functioning compliance webhooks are an automatic review rejection.
  # An invalid HMAC must return 401; app/routes/webhooks.compliance.tsx does.
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
